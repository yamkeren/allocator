[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allocator-client"
version = "0.1.0"
description = "Client library and CLI for distributed USB resource orchestration"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer[all]>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "structlog>=24.2",
    "allocator-contract",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
allocator = "allocator_client.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["allocator_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
