[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allocator-agent"
version = "0.1.0"
description = "Node agent for distributed USB resource orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx[asyncio]>=0.27",
    "pyudev>=0.24",
    "pyusb>=1.2",
    "structlog>=24.2",
    "prometheus-client>=0.20",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
allocator-agent = "allocator_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["allocator_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
