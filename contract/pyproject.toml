[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allocator-contract"
version = "0.1.0"
description = "Shared API contract (Pydantic models) for the allocator manager/agent/client"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["allocator_contract"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
