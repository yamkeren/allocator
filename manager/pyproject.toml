[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "allocator-manager"
version = "0.1.0"
description = "Central manager for distributed USB resource orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx[asyncio]>=0.27",
    "structlog>=24.2",
    "allocator-contract",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["allocator_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
